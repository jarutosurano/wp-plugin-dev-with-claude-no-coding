name: Test & Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./docs

      - name: Build documentation
        run: npm run build
        working-directory: ./docs

      - name: Check for broken links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --offline
            --include-fragments
            --no-progress
            --exclude 'jarutosurano.github.io'
            --exclude 'claude.ai'
            --exclude 'reddit.com'
            --exclude 'udemy.com'
            --exclude 'linkedin.com'
            --exclude 'localhost'
            './docs/dist/**/*.html'
          fail: true

      - name: Upload build artifact for e2e
        uses: actions/upload-artifact@v4
        with:
          name: docs-dist
          path: ./docs/dist
          retention-days: 1

  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-dist
          path: ./docs/dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install serve
        run: npm install -g serve

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

  validate-plugins:
    name: Validate Plugin Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check plugin headers
        run: |
          echo "Validating plugin file headers..."
          found_plugins=false
          for plugin_dir in plugins/*/; do
            if [ -d "$plugin_dir" ]; then
              plugin_name=$(basename "$plugin_dir")
              main_file="$plugin_dir$plugin_name.php"
              if [ -f "$main_file" ]; then
                found_plugins=true
                echo "Checking $main_file..."
                if grep -q "Plugin Name:" "$main_file"; then
                  echo "✓ $plugin_name has valid plugin header"
                else
                  echo "✗ $plugin_name missing Plugin Name header"
                  exit 1
                fi
              fi
            fi
          done
          if [ "$found_plugins" = false ]; then
            echo "No plugins found yet - skipping validation"
          fi
          echo "Plugin validation complete!"

  php-syntax:
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Check PHP syntax
        run: |
          echo "Checking PHP syntax in plugins..."
          php_files=$(find plugins -name "*.php" 2>/dev/null || true)
          if [ -z "$php_files" ]; then
            echo "No PHP files found yet - skipping syntax check"
          else
            echo "$php_files" | xargs -n1 php -l
          fi
          echo "PHP syntax check complete!"
